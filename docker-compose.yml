services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: holdview
      POSTGRES_PASSWORD: holdview
      POSTGRES_DB: holdview
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holdview"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://holdview:holdview@db:5432/holdview
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: 
      - "5174:80"
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pgdata: